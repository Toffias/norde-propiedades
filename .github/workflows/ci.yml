name: CI

on:
  pull_request:
  push:
    branches: [main, uat]

concurrency:
  group: ci-${{ github.ref }}
  # En los PR, un push nuevo cancela la corrida anterior; en `main` y `uat` no, para no cortar un
  # deploy a mitad de camino.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint, typecheck, tests y build
        run: pnpm turbo run lint typecheck test build
        env:
          # Valores ficticios: el build carga la config de Payload pero no se conecta a la base.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else-000000
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: norde
          POSTGRES_PASSWORD: norde
          POSTGRES_DB: norde_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U norde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tests de integración (Postgres real)
        run: pnpm --filter @norde/infra test:int
        env:
          TEST_DATABASE_URL: postgres://norde:norde@localhost:5432/norde_test

  # Tests e2e del panel con Playwright, contra el build de producción y una base `norde_e2e` que
  # se recrea con migraciones y seed (apps/gestion/e2e/README.md).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: norde
          POSTGRES_PASSWORD: norde
          POSTGRES_DB: norde_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U norde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://norde:norde@localhost:5432/norde_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Navegador de Playwright
        run: pnpm --filter @norde/gestion exec playwright install --with-deps chromium

      - name: Build del panel
        run: pnpm turbo run build --filter=@norde/gestion

      - name: Tests e2e
        run: pnpm --filter @norde/gestion test:e2e

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/gestion/e2e/.report
            apps/gestion/e2e/.results
          retention-days: 7

  # Un push a `uat` que pasa CI se publica en el VPS (docs/deploy.md). Va como workflow reutilizable
  # y no con `workflow_run`, que solo dispara desde la rama por defecto.
  deploy-uat:
    needs: [check, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    uses: ./.github/workflows/deploy-uat.yml
    secrets: inherit
