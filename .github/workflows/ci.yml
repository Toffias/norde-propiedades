name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint, typecheck, tests y build
        run: pnpm turbo run lint typecheck test build
        env:
          # Valores ficticios: el build carga la config de Payload pero no se conecta a la base.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else-000000
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: norde
          POSTGRES_PASSWORD: norde
          POSTGRES_DB: norde_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U norde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tests de integración (Postgres real)
        run: pnpm --filter @norde/infra test:int
        env:
          TEST_DATABASE_URL: postgres://norde:norde@localhost:5432/norde_test
